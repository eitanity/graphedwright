<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 396 1480 572" class="graphedwright" data-mode="view" role="img" aria-labelledby="graphedwright-title"><title id="graphedwright-title"></title><desc></desc><style>/* The default look of a graphedwright drawing. A host styles by class;
   nothing here is required. */

.graphedwright { font-family: system-ui, sans-serif; font-size: 12px; }

.graphedwright .vertex .shape { fill: #f5f7fa; stroke: #4a5568; stroke-width: 1.2; }
.graphedwright .vertex .label { fill: #1a202c; }
.graphedwright .vertex .annotation { fill: #4a5568; font-size: 10px; }
.graphedwright .vertex.container &gt; .shape { fill: #f8fafc; stroke: #718096; }
.graphedwright .vertex.container &gt; .label { fill: #4a5568; font-weight: 600; }
.graphedwright .vertex .box { fill: transparent; stroke: none; }
.graphedwright .vertex .store { stroke: none; }
.graphedwright .vertex .figure { fill: none; stroke: #4a5568; stroke-width: 1.2; }
.graphedwright .vertex .shape .mark { fill: #4a5568; }
.graphedwright .vertex.dashed .shape { stroke-dasharray: 6 4; }
.graphedwright .port { fill: #ffffff; stroke: #4a5568; stroke-width: 1; }
.graphedwright .port-label { fill: #4a5568; font-size: 10px; }

.graphedwright .edge path { fill: none; stroke: #718096; }
.graphedwright .edge .label { fill: #2d3748; }
.graphedwright .edge .annotation { fill: #718096; font-size: 10px; }
.graphedwright .arrowhead path { fill: #718096; stroke: none; }
.graphedwright .arrowhead.open path { fill: none; stroke: #718096; stroke-width: 1.5; }
.graphedwright .arrowhead.hollow path { fill: #ffffff; stroke: #718096; stroke-width: 1.2; }
.graphedwright .arrowhead circle { fill: #718096; stroke: none; }
.graphedwright .tail path { fill: #718096; stroke: #718096; stroke-width: 1.2; }
.graphedwright .tail.hollow path { fill: #ffffff; }
.graphedwright .tail.plus circle { fill: #ffffff; stroke: #718096; stroke-width: 1.2; }
.graphedwright .tail.plus path { fill: none; }
.graphedwright .edge.dashed path { stroke-dasharray: 6 4; }
.graphedwright .edge .stereotype { fill: #4a5568; font-size: 11px; }
.graphedwright .vertex .keyword { fill: #4a5568; font-size: 11px; }
.graphedwright .vertex .compartment line { stroke: #718096; stroke-width: 1; }
.graphedwright .vertex .compartment .entry { fill: #2d3748; font-size: 11px; }
.graphedwright .edge text { paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }

/* A text cut to fit is followed by itself in full, not displayed; on
   hover the full text takes the cut one's place, with a halo to read
   over what it overruns. A vertex drawn later can still cover it; the
   browser binding draws it in the overlay as well, over everything. */
.graphedwright .vertex:hover .cut { display: none; }
.graphedwright .vertex:hover .full { display: inline; }
.graphedwright .vertex .full { paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }

/* A selected vertex is outlined; a selected edge has a halo as wide as
   the stroke-width the renderer writes on it, which a width here would
   override. */
.graphedwright .overlay rect.selection { fill: none; stroke: #3182ce; stroke-width: 1.5; stroke-dasharray: 3 2; }
.graphedwright .overlay path.selection { fill: none; stroke: #3182ce; stroke-opacity: 0.4; stroke-linecap: round; stroke-linejoin: round; }
.graphedwright .overlay .ghost { fill: none; stroke: #3182ce; stroke-width: 1.5; stroke-dasharray: 4 3; }
.graphedwright .overlay .marquee { fill: rgba(49, 130, 206, 0.08); stroke: #3182ce; stroke-width: 1; }
.graphedwright .overlay .handle { fill: #ffffff; stroke: #3182ce; stroke-width: 1.5; cursor: nwse-resize; }
.graphedwright .overlay .expanded { pointer-events: none; }
.graphedwright .overlay .expanded .backing { fill: #ffffff; stroke: none; }
.graphedwright .overlay .expanded text { fill: #1a202c; }
.graphedwright .overlay .expanded .keyword, .graphedwright .overlay .expanded .entry { fill: #2d3748; font-size: 11px; }
.graphedwright .overlay .expanded .annotation { fill: #4a5568; font-size: 10px; }
.graphedwright .overlay .target .ring { fill: none; stroke: #3182ce; stroke-opacity: 0.35; cursor: crosshair; pointer-events: stroke; }

.graphedwright[data-mode="edit"] .vertex { cursor: move; }
.graphedwright[data-mode="edit"] .port { cursor: crosshair; }
.graphedwright[data-mode="edit"] .edge path { cursor: pointer; }

/* The elements the browser binding makes around the drawing: the host
   holds the palette, the drawing, which takes the room below it, the
   zoom buttons over the drawing's bottom right corner, and the input
   that edits a label, placed over the label. A page gives the host or
   the drawing a height. */
.graphedwright-host { position: relative; display: flex; flex-direction: column; }
.graphedwright-palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-bottom: 1px solid #e2e8f0; background: #f7fafc; }
.graphedwright-palette:empty { display: none; }
.graphedwright-item.graphedwright-edge { font-style: italic; }
.graphedwright-drawing { flex: 1 1 auto; min-height: 320px; touch-action: none; }
.graphedwright-drawing svg { width: 100%; height: 100%; display: block; }
.graphedwright-label { position: absolute; box-sizing: border-box; padding: 0 4px; font: inherit; text-align: center; border: 1px solid #3182ce; border-radius: 3px; background: #ffffff; }
.graphedwright-zoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.graphedwright-zoom button { min-width: 28px; }
.graphedwright-chosen { background: #bee3f8; border-color: #3182ce; }
</style><defs><marker id="arrow-0" class="arrowhead kind-transition" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g class="containers"><g class="vertex kind-composite_state container unplaced" id="gesture" data-kind="composite state" transform="translate(908 654)" data-internal="a key other than Escape: ignored" data-exit="drop what the gesture held"><rect class="shape" x="-224" y="-190" width="448" height="380" rx="6"/><text class="label" x="-216" y="-176" text-anchor="start">Pointer gesture</text></g></g><g class="edges"><g class="edge kind-transition" id="t1" data-kind="transition" data-from="start" data-to="idle"><path d="M 12 752 C 51.5 752, 51.5 752, 91 752" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="56" y="747.25" text-anchor="middle">New</text></g><g class="edge kind-transition" id="t2" data-kind="transition" data-from="idle" data-to="press" data-event="Press" data-guard="not held, unless with the middle button or Alt"><path d="M 220 760 C 279 760, 279 694.33, 338 694.33 C 392.5 694.33, 392.5 648.67, 447 648.67" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="338" y="689.58" text-anchor="middle">Press</text></g><g class="edge kind-transition" id="t3" data-kind="transition" data-from="press" data-to="panning" data-guard="middle button or Alt"><path d="M 510.86 659.14 C 601.43 659.14, 601.43 492, 692 492 L 886 492 L 886 670 L 952 670 L 987 670" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="837.5" y="487.25" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t4" data-kind="transition" data-from="press" data-to="resizing" data-guard="on the resize handle of the one selected vertex, in edit mode"><path d="M 490.29 671.71 C 590.64 671.71, 590.64 808, 691 808" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="628.28" y="791.31" text-anchor="middle">[resize handle]</text></g><g class="edge kind-transition" id="t5" data-kind="transition" data-from="press" data-to="dragging" data-guard="on a vertex, in edit mode" data-actions="select it, adding to the selection with Shift; remember where the vertices to drag are"><path d="M 510.86 652.86 C 600.93 652.86, 600.93 584, 691 584" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="605.43" y="613.68" text-anchor="middle">[vertex] / select</text></g><g class="edge kind-transition" id="t6" data-kind="transition" data-from="press" data-to="connecting" data-guard="on a port or an outline, in edit mode" data-actions="remember the port or outline the edge starts at"><path d="M 500.57 665.43 C 595.79 665.43, 595.79 680, 691 680" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="539.39" y="679.06" text-anchor="middle">[port or outline]</text></g><g class="edge kind-transition" id="t7" data-kind="transition" data-from="press" data-to="selecting" data-guard="on the background" data-actions="select nothing, unless Shift is held"><path d="M 500.57 646.57 C 595.79 646.57, 595.79 520, 691 520" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="600.29" y="578.54" text-anchor="middle">[background]</text></g><g class="edge kind-transition" id="t8" data-kind="transition" data-from="press" data-to="idle" data-guard="on an edge, or on a vertex, a port or an outline in view mode" data-actions="select it, adding to the selection with Shift"><path d="M 456 663.33 C 397 663.33, 397 723.67, 338 723.67 C 283.5 723.67, 283.5 764, 229 764" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="338" y="736.42" text-anchor="middle">[edge, or view mode] / select</text></g><g class="edge kind-transition" id="t9" data-kind="transition" data-from="idle" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="remember the vertex kind"><path d="M 220 768 C 330 768, 330 704, 440 704 L 520 704 C 605.5 704, 605.5 744, 691 744" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="638.44" y="748.11" text-anchor="middle">PaletteVertex</text></g><g class="edge kind-transition" id="t10" data-kind="transition" data-from="gesture" data-to="idle" data-event="Release" data-actions="move the selection, select in the marquee or resize, if the pointer moved; add the edge or the vertex; by command"><path d="M 684 654 C 602 654, 602 728, 520 728 L 440 728 C 334.5 728, 334.5 752, 229 752" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="480" y="723.25" text-anchor="middle">Release / finish</text></g><g class="edge kind-transition" id="t11" data-kind="transition" data-from="gesture" data-to="idle" data-event="Escape, Blur, TextCancel, PaletteEdge, View, Edit, Hold, Context, DoubleClick on the background" data-actions="put a drag back where it began; for PaletteEdge, choose the edge kind; for Context, select what is hit, unless it is selected"><path d="M 684 674 C 602 674, 602 752, 520 752 L 440 752 C 334.5 752, 334.5 756, 229 756" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="480" y="764.75" text-anchor="middle">Escape, Blur, Hold / cancel</text></g><g class="edge kind-transition" id="t12" data-kind="transition" data-from="idle" data-to="editing" data-event="Enter, F2, a printable key" data-guard="one element selected, edit mode, not held"><path d="M 220 736 C 330 736, 330 872, 440 872 L 520 872 L 680 872 L 1144 872 C 1217.5 872, 1217.5 440, 1291 440" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="912" y="867.25" text-anchor="middle">Enter, F2, a key [one selected]</text></g><g class="edge kind-transition" id="t13" data-kind="transition" data-from="idle" data-to="editing" data-event="DoubleClick" data-guard="on a vertex, a port, an outline or an edge, edit mode, not held" data-actions="select it alone"><path d="M 220 740 C 330 740, 330 896, 440 896 L 520 896 L 680 896 L 1144 896 C 1217.5 896, 1217.5 445, 1291 445" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="912" y="908.75" text-anchor="middle">DoubleClick [element] / select</text></g><g class="edge kind-transition" id="t14" data-kind="transition" data-from="editing" data-to="idle" data-event="TextDone" data-actions="set the label, or the attribute its kind edits, by command"><path d="M 1300 450 C 1222 450, 1222 920, 1144 920 L 680 920 L 520 920 L 440 920 C 334.5 920, 334.5 744, 229 744" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="480" y="915.25" text-anchor="middle">TextDone / relabel</text></g><g class="edge kind-transition" id="t15" data-kind="transition" data-from="editing" data-to="idle" data-event="TextCancel, Escape, Blur, PaletteEdge, View, Edit, Hold, Context, DoubleClick on the background" data-actions="for PaletteEdge, choose the edge kind; for Context, select what is hit, unless it is selected"><path d="M 1300 455 C 1222 455, 1222 944, 1144 944 L 680 944 L 520 944 L 440 944 C 334.5 944, 334.5 748, 229 748" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="480" y="939.25" text-anchor="middle">TextCancel, Escape, Hold</text></g><g class="edge kind-transition" id="t16" data-kind="transition" data-from="editing" data-to="press" data-event="Press" data-actions="end the editing; the host commits the text first"><path d="M 1300 430 C 1222 430, 1222 440, 1144 440 L 680 440 C 589.64 440, 589.64 640.29, 499.29 640.29" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="912" y="435.25" text-anchor="middle">Press / end editing</text></g><g class="edge kind-transition" id="t17" data-kind="transition" data-from="connecting" data-to="panning" data-event="Press" data-guard="middle button or Alt"><path d="M 820 680 C 903.5 680, 903.5 680, 987 680" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="908" y="675.25" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t18" data-kind="transition" data-from="placing" data-to="panning" data-event="Press" data-guard="middle button or Alt"><path d="M 820 754 C 903.5 754, 903.5 690, 987 690" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="863.65" y="760.09" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t19" data-kind="transition" data-from="gesture" data-to="editing" data-event="DoubleClick" data-guard="on a vertex, a port, an outline or an edge, edit mode, not held" data-actions="put a drag back where it began; select it alone"><path d="M 1132 654 C 1211.5 654, 1211.5 425, 1291 425" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1277.15" y="426.66" text-anchor="middle">DoubleClick [element]</text></g><g class="edge kind-transition" id="t20" data-kind="transition" data-from="editing" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="remember the vertex kind"><path d="M 1300 435 C 1212 435, 1212 492, 1124 492 L 930 492 L 930 734 L 864 734 L 829 734" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="978.5" y="487.25" text-anchor="middle">PaletteVertex</text></g><g class="edge kind-transition" id="t21" data-kind="transition" data-from="gesture" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="put a drag back where it began; remember the vertex kind"><path d="M 684 634 L 668 634 C 667.5 634, 667.5 716, 667 716 L 835 716 C 834.5 716, 834.5 744, 834 744 L 829 744" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="834.7" y="715.62" text-anchor="middle">PaletteVertex</text></g></g><g class="vertices"><g class="vertex kind-initial unplaced" id="start" data-kind="initial" transform="translate(0 752)"><g class="shape shape-filled-circle"><path class="mark" d="M -12 0 A 12 12 0 0 1 12 0 A 12 12 0 0 1 -12 0 Z"/></g><text class="label" x="0" y="26" text-anchor="middle"></text></g><g class="vertex kind-state unplaced" id="idle" data-kind="state" transform="translate(160 752)" data-internal="Tab / select the next vertex; Delete, an arrow, Ctrl-Z, Ctrl-Y / a command, refused in view mode or held; Context / select what is hit for the host's actions; View, Edit / set the mode; Hold, Unhold / hold the editor while the host waits"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Idle</text></g><g class="vertex kind-choice unplaced" id="press" data-kind="choice" transform="translate(480 656)"><polygon class="shape" points="0 -22 36 0 0 22 -36 0"/><text class="label" x="0" y="4" text-anchor="middle">under it?</text></g><g class="vertex kind-state unplaced" id="selecting" data-kind="state" transform="translate(760 520)" data-internal="Move / draw the marquee; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Selecting</text></g><g class="vertex kind-state unplaced" id="dragging" data-kind="state" transform="translate(760 584)" data-internal="Move / move the selection; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Dragging</text></g><g class="vertex kind-state unplaced" id="connecting" data-kind="state" transform="translate(760 680)" data-internal="Move / draw the edge to the pointer; Press / only the pointer moves"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Connecting</text></g><g class="vertex kind-state unplaced" id="placing" data-kind="state" transform="translate(760 744)" data-internal="Move / the new vertex follows the pointer; Press / only the pointer moves"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Placing</text></g><g class="vertex kind-state unplaced" id="panning" data-kind="state" transform="translate(1056 680)" data-internal="Move / pan the view; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Panning</text></g><g class="vertex kind-state unplaced" id="resizing" data-kind="state" transform="translate(760 808)" data-internal="Move / draw the new size; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Resizing</text></g><g class="vertex kind-state unplaced" id="editing" data-kind="state" transform="translate(1360 440)" data-entry="the host shows an input for the label, or the attribute its kind edits" data-exit="the host hides it" data-internal="Move, Release, a key: ignored; the input has the keyboard"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">EditingText</text></g></g><g class="overlay"></g></svg>
