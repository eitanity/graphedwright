<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 -176 1192 460" class="graphedwright" data-mode="view" role="img" aria-labelledby="graphedwright-title"><title id="graphedwright-title"></title><desc></desc><style>/* The default look of a graphedwright drawing. A host styles by class;
   nothing here is required. */

.graphedwright { font-family: system-ui, sans-serif; font-size: 12px; }

.graphedwright .vertex .shape { fill: #f5f7fa; stroke: #4a5568; stroke-width: 1.2; }
.graphedwright .vertex .label { fill: #1a202c; }
.graphedwright .vertex .annotation { fill: #4a5568; font-size: 10px; }
.graphedwright .vertex.container &gt; .shape { fill: #f8fafc; stroke: #718096; }
.graphedwright .vertex.container &gt; .label { fill: #4a5568; font-weight: 600; }
.graphedwright .vertex .box { fill: transparent; stroke: none; }
.graphedwright .vertex .store { stroke: none; }
.graphedwright .vertex .figure { fill: none; stroke: #4a5568; stroke-width: 1.2; }
.graphedwright .vertex.dashed .shape { stroke-dasharray: 6 4; }
.graphedwright .port { fill: #ffffff; stroke: #4a5568; stroke-width: 1; }

.graphedwright .edge path { fill: none; stroke: #718096; }
.graphedwright .edge .label { fill: #2d3748; }
.graphedwright .edge .annotation { fill: #718096; font-size: 10px; }
.graphedwright .edge.hold path { stroke-dasharray: 6 3; }
.graphedwright .arrowhead path { fill: #718096; stroke: none; }
.graphedwright .arrowhead.open path { fill: none; stroke: #718096; stroke-width: 1.5; }
.graphedwright .arrowhead.hollow path { fill: #ffffff; stroke: #718096; stroke-width: 1.2; }
.graphedwright .edge.dashed path { stroke-dasharray: 6 4; }
.graphedwright .edge .stereotype { fill: #4a5568; font-size: 11px; }
.graphedwright .edge text { paint-order: stroke; stroke: #ffffff; stroke-width: 3px; stroke-linejoin: round; }

/* A selected vertex is outlined; a selected edge has a halo as wide as
   the stroke-width the renderer writes on it, which a width here would
   override. */
.graphedwright .overlay rect.selection { fill: none; stroke: #3182ce; stroke-width: 1.5; stroke-dasharray: 3 2; }
.graphedwright .overlay path.selection { fill: none; stroke: #3182ce; stroke-opacity: 0.4; stroke-linecap: round; stroke-linejoin: round; }
.graphedwright .overlay .ghost { fill: none; stroke: #3182ce; stroke-width: 1.5; stroke-dasharray: 4 3; }
.graphedwright .overlay .marquee { fill: rgba(49, 130, 206, 0.08); stroke: #3182ce; stroke-width: 1; }
.graphedwright .overlay .handle { fill: #ffffff; stroke: #3182ce; stroke-width: 1.5; cursor: nwse-resize; }
.graphedwright .overlay .target .ring { fill: none; stroke: #3182ce; stroke-opacity: 0.35; cursor: crosshair; pointer-events: stroke; }

.graphedwright[data-mode="edit"] .vertex { cursor: move; }
.graphedwright[data-mode="edit"] .port { cursor: crosshair; }
.graphedwright[data-mode="edit"] .edge path { cursor: pointer; }

/* The elements the browser binding makes around the drawing: the host
   holds the palette, the drawing, which takes the room below it, the
   zoom buttons over the drawing's bottom right corner, and the input
   that edits a label, placed over the label. A page gives the host or
   the drawing a height. */
.graphedwright-host { position: relative; display: flex; flex-direction: column; }
.graphedwright-palette { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-bottom: 1px solid #e2e8f0; background: #f7fafc; }
.graphedwright-palette:empty { display: none; }
.graphedwright-item.graphedwright-edge { font-style: italic; }
.graphedwright-drawing { flex: 1 1 auto; min-height: 320px; touch-action: none; }
.graphedwright-drawing svg { width: 100%; height: 100%; display: block; }
.graphedwright-label { position: absolute; box-sizing: border-box; padding: 0 4px; font: inherit; text-align: center; border: 1px solid #3182ce; border-radius: 3px; background: #ffffff; }
.graphedwright-zoom { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 4px; }
.graphedwright-zoom button { min-width: 28px; }
.graphedwright-chosen { background: #bee3f8; border-color: #3182ce; }
</style><defs><marker id="arrow-0" class="arrowhead transition" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g class="containers"><g class="vertex composite_state container unplaced" id="gesture" data-kind="composite state" transform="translate(1056 54)" data-internal="a key other than Escape: ignored" data-exit="drop what the gesture held"><rect class="shape" x="-76" y="-206" width="152" height="412" rx="6"/><text class="label" x="-68" y="-192" text-anchor="start">Pointer gesture</text></g></g><g class="edges"><g class="edge transition" id="t1" data-kind="transition" data-from="start" data-to="idle"><path d="M 12 104 C 51.5 104, 51.5 104, 91 104" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="56" y="99.25" text-anchor="middle">New</text></g><g class="edge transition" id="t2" data-kind="transition" data-from="idle" data-to="press" data-event="Press"><path d="M 220 104 L 456 104 L 584 104 C 653.5 104, 653.5 56, 723 56" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="520" y="99.25" text-anchor="middle">Press</text></g><g class="edge transition" id="t3" data-kind="transition" data-from="press" data-to="panning" data-guard="middle button or Alt"><path d="M 804 56 C 895.5 56, 895.5 160, 987 160" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="900" y="103.25" text-anchor="middle">[middle button or Alt]</text></g><g class="edge transition" id="t4" data-kind="transition" data-from="press" data-to="resizing" data-guard="on the resize handle, in edit mode"><path d="M 804 56 C 895.5 56, 895.5 224, 987 224" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="900" y="135.25" text-anchor="middle">[resize handle]</text></g><g class="edge transition" id="t5" data-kind="transition" data-from="press" data-to="dragging" data-guard="on a vertex, in edit mode" data-actions="select it; remember where the selection is"><path d="M 804 56 C 895.5 56, 895.5 -32, 987 -32" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="900" y="7.25" text-anchor="middle">[vertex] / select</text></g><g class="edge transition" id="t6" data-kind="transition" data-from="press" data-to="connecting" data-guard="on a port or an outline, in edit mode" data-actions="remember where the edge starts"><path d="M 804 56 C 895.5 56, 895.5 32, 987 32" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="900" y="39.25" text-anchor="middle">[port or outline]</text></g><g class="edge transition" id="t7" data-kind="transition" data-from="press" data-to="selecting" data-guard="on the background" data-actions="clear the selection, unless Shift is held"><path d="M 804 56 C 895.5 56, 895.5 -96, 987 -96" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="900" y="-24.75" text-anchor="middle">[background]</text></g><g class="edge transition" id="t8" data-kind="transition" data-from="press" data-to="idle" data-guard="on an edge, or on a vertex in view mode" data-actions="select it"><path d="M 732 56 C 658 56, 658 128, 584 128 L 456 128 C 342.5 128, 342.5 104, 229 104" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="520" y="123.25" text-anchor="middle">[edge, or view mode] / select</text></g><g class="edge transition" id="t9" data-kind="transition" data-from="idle" data-to="placing" data-event="PaletteVertex" data-guard="edit mode" data-actions="remember the vertex kind"><path d="M 220 104 C 338 104, 338 152, 456 152 L 584 152 C 656 152, 656 104, 728 104 L 808 104 C 897.5 104, 897.5 96, 987 96" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="768" y="99.25" text-anchor="middle">PaletteVertex</text></g><g class="edge transition" id="t10" data-kind="transition" data-from="gesture" data-to="idle" data-event="Release" data-actions="move the selection, select in the marquee, add the edge, add the vertex or resize, by command"><path d="M 980 54 C 894 54, 894 128, 808 128 L 728 128 C 656 128, 656 176, 584 176 L 456 176 C 342.5 176, 342.5 104, 229 104" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="520" y="171.25" text-anchor="middle">Release / finish</text></g><g class="edge transition" id="t11" data-kind="transition" data-from="gesture" data-to="idle" data-event="Escape, Blur, TextCancel, PaletteEdge, View, Edit" data-actions="put a drag back where it began"><path d="M 980 54 C 894 54, 894 152, 808 152 L 728 152 C 656 152, 656 200, 584 200 L 456 200 C 342.5 200, 342.5 104, 229 104" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="520" y="195.25" text-anchor="middle">Escape, Blur / cancel</text></g><g class="edge transition" id="t12" data-kind="transition" data-from="idle" data-to="editing" data-event="Enter, F2, a printable key" data-guard="one element selected, edit mode"><path d="M 220 104 C 280 104, 280 50, 340 50 C 395.5 50, 395.5 56, 451 56" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="340" y="45.25" text-anchor="middle">Enter, F2, a key [one selected]</text></g><g class="edge transition" id="t13" data-kind="transition" data-from="idle" data-to="editing" data-event="DoubleClick" data-guard="on a vertex or an edge, edit mode" data-actions="select it alone"><path d="M 220 104 C 280 104, 280 70, 340 70 C 395.5 70, 395.5 56, 451 56" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="340" y="65.25" text-anchor="middle">DoubleClick [element] / select</text></g><g class="edge transition" id="t14" data-kind="transition" data-from="editing" data-to="idle" data-event="TextDone" data-actions="relabel the element, by command"><path d="M 460 56 C 400 56, 400 90, 340 90 C 284.5 90, 284.5 104, 229 104" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="340" y="85.25" text-anchor="middle">TextDone / relabel</text></g><g class="edge transition" id="t15" data-kind="transition" data-from="editing" data-to="idle" data-event="TextCancel, Escape, Blur"><path d="M 460 56 C 400 56, 400 110, 340 110 C 284.5 110, 284.5 104, 229 104" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="340" y="105.25" text-anchor="middle">TextCancel, Escape</text></g><g class="edge transition" id="t16" data-kind="transition" data-from="editing" data-to="press" data-event="Press" data-actions="end the editing; the host commits the text first"><path d="M 580 56 C 651.5 56, 651.5 56, 723 56" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="656" y="51.25" text-anchor="middle">Press / end editing</text></g></g><g class="vertices"><g class="vertex initial unplaced" id="start" data-kind="initial" transform="translate(0 104)"><ellipse class="shape" cx="0" cy="0" rx="12" ry="12"/><text class="label" x="0" y="4" text-anchor="middle"></text></g><g class="vertex state unplaced" id="idle" data-kind="state" transform="translate(160 104)" data-internal="Tab / select the next vertex; Delete, an arrow, Ctrl-Z, Ctrl-Y / a command, refused in view mode"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Idle</text></g><g class="vertex choice unplaced" id="press" data-kind="choice" transform="translate(768 56)"><polygon class="shape" points="0 -22 36 0 0 22 -36 0"/><text class="label" x="0" y="4" text-anchor="middle">under it?</text></g><g class="vertex state unplaced" id="selecting" data-kind="state" transform="translate(1056 -96)" data-internal="Move / draw the marquee; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Selecting</text></g><g class="vertex state unplaced" id="dragging" data-kind="state" transform="translate(1056 -32)" data-internal="Move / move the selection; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Dragging</text></g><g class="vertex state unplaced" id="connecting" data-kind="state" transform="translate(1056 32)" data-internal="Move / draw the edge to the pointer; Press / only the pointer moves, and with the middle button or Alt it pans"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Connecting</text></g><g class="vertex state unplaced" id="placing" data-kind="state" transform="translate(1056 96)" data-internal="Move / the new vertex follows the pointer; Press / only the pointer moves, and with the middle button or Alt it pans"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Placing</text></g><g class="vertex state unplaced" id="panning" data-kind="state" transform="translate(1056 160)" data-internal="Move / pan the view; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Panning</text></g><g class="vertex state unplaced" id="resizing" data-kind="state" transform="translate(1056 224)" data-internal="Move / draw the new size; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Resizing</text></g><g class="vertex state unplaced" id="editing" data-kind="state" transform="translate(520 56)" data-entry="the host shows the label input" data-exit="the host hides it" data-internal="Release, a key: ignored; the input has the keyboard"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">EditingText</text></g></g><g class="overlay"></g></svg>
