0" y="4" text-anchor="middle">api-client</text></g><g class="vertex box unplaced" id="logger" data-kind="box" transform="translate(952 192)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">logger</text></g><g class="vertex box unplaced" id="history" data-kind="box" transform="translate(352 192)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">history</text></g><g class="vertex box unplaced" id="icons" data-kind="box" transform="translate(496 192)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">icons</text></g><g class="vertex box unplaced" id="theme" data-kind="box" transform="translate(640 192)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">theme</text></g><g class="vertex box unplaced" id="http" data-kind="box" transform="translate(640 288)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">http</text></g><g class="vertex box unplaced" id="auth" data-kind="box" transform="translate(784 192)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">auth</text></g><g class="vertex box unplaced" id="crypto" data-kind="box" transform="translate(496 288)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">crypto</text></g><g class="vertex box unplaced" id="url" data-kind="box" transform="translate(352 384)"><rect class="shape" x="-60" y="-18" width="120" height="36" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">url</text></g><g class="vertex box unplaced" id="format" data-kind="box" transform="translate(784 288)"><rect class="shape" x="-60" y="-18" width="120" hei