<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 396 1896 572" class="graphedwright" data-mode="view" role="img" aria-labelledby="graphedwright-title"><title id="graphedwright-title">The editor's gestures</title><desc></desc><defs><marker id="arrow-0" class="arrowhead kind-transition" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g class="containers"><g class="vertex kind-composite_state container unplaced" id="gesture" data-kind="composite state" transform="translate(1200 654)" data-internal="a key other than Escape: ignored" data-exit="drop what the gesture held"><rect class="shape" x="-276" y="-190" width="552" height="380" rx="6"/><text class="label" x="-268" y="-176" text-anchor="start">Pointer gesture</text></g></g><g class="edges"><g class="edge kind-transition" id="t1" data-kind="transition" data-from="start" data-to="idle"><path d="M 12 752 C 51.5 752, 51.5 752, 91 752" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="56" y="747.25" text-anchor="middle">New</text></g><g class="edge kind-transition" id="t2" data-kind="transition" data-from="idle" data-to="press" data-event="Press" data-guard="not held, unless with the middle button or Alt"><path d="M 220 740 C 250 740, 250 648.67, 280 648.67 L 588 648.67 L 599 648.67" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="572.6" y="643.92" text-anchor="middle">Press</text></g><g class="edge kind-transition" id="t3" data-kind="transition" data-from="press" data-to="panning" data-guard="middle button or Alt"><path d="M 652.57 646.57 C 792.29 646.57, 792.29 492, 932 492 L 1332 492 L 1332 670 L 1336 670 L 1340 670" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1332" y="643" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t4" data-kind="transition" data-from="press" data-to="resizing" data-guard="on the resize handle of the one selected vertex, in edit mode"><path d="M 642.29 671.71 C 786.64 671.71, 786.64 808, 931 808" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="808.01" y="767.82" text-anchor="middle">[resize handle]</text></g><g class="edge kind-transition" id="t5" data-kind="transition" data-from="press" data-to="dragging" data-guard="on a vertex, in edit mode" data-actions="select it, adding to the selection with Shift; remember where the vertices to drag are"><path d="M 662.86 659.14 C 796.93 659.14, 796.93 584, 931 584" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="857.72" y="608.49" text-anchor="middle">[vertex] / select</text></g><g class="edge kind-transition" id="t6" data-kind="transition" data-from="press" data-to="connecting" data-guard="on a port or an outline, in edit mode" data-actions="remember the port or outline the edge starts at"><path d="M 652.57 665.43 C 791.79 665.43, 791.79 680, 931 680" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="796.29" y="667.96" text-anchor="middle">[port or outline]</text></g><g class="edge kind-transition" id="t7" data-kind="transition" data-from="press" data-to="selecting" data-guard="on the background" data-actions="select nothing, unless Shift is held"><path d="M 662.86 652.86 C 796.93 652.86, 796.93 520, 931 520" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="886.06" y="540.82" text-anchor="middle">[background]</text></g><g class="edge kind-transition" id="t8" data-kind="transition" data-from="press" data-to="idle" data-guard="on an edge, or on a vertex, a port or an outline in view mode" data-actions="select it, adding to the selection with Shift"><path d="M 608 663.33 L 588 663.33 L 280 663.33 C 254.5 663.33, 254.5 744, 229 744" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="434" y="676.08" text-anchor="middle">[edge, or view mode] / select</text></g><g class="edge kind-transition" id="t9" data-kind="transition" data-from="idle" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="remember the vertex kind"><path d="M 220 748 C 362 748, 362 704, 504 704 L 760 704 C 845.5 704, 845.5 744, 931 744" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="632" y="699.25" text-anchor="middle">PaletteVertex</text></g><g class="edge kind-transition" id="t10" data-kind="transition" data-from="gesture" data-to="idle" data-event="Release" data-actions="move the selection, select in the marquee or resize, if the pointer moved; add the edge or the vertex; by command"><path d="M 924 654 C 842 654, 842 728, 760 728 L 504 728 C 366.5 728, 366.5 752, 229 752" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="632" y="723.25" text-anchor="middle">Release / finish</text></g><g class="edge kind-transition" id="t11" data-kind="transition" data-from="gesture" data-to="idle" data-event="Escape, Blur, TextCancel, PaletteEdge, View, Edit, Hold, Context, DoubleClick on the background" data-actions="put a drag back where it began; for PaletteEdge, choose the edge kind; for Context, select what is hit, unless it is selected"><path d="M 924 674 C 842 674, 842 752, 760 752 L 504 752 C 366.5 752, 366.5 736, 229 736" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="632" y="747.25" text-anchor="middle">Escape, Blur, Hold / cancel</text></g><g class="edge kind-transition" id="t12" data-kind="transition" data-from="idle" data-to="editing" data-event="Enter, F2, a printable key" data-guard="one element selected, edit mode, not held"><path d="M 220 756 C 362 756, 362 872, 504 872 L 760 872 L 920 872 L 1480 872 C 1593.5 872, 1593.5 440, 1707 440" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1200" y="867.25" text-anchor="middle">Enter, F2, a key [one selected]</text></g><g class="edge kind-transition" id="t13" data-kind="transition" data-from="idle" data-to="editing" data-event="DoubleClick" data-guard="on a vertex, a port, an outline or an edge, edit mode, not held" data-actions="select it alone"><path d="M 220 760 C 362 760, 362 896, 504 896 L 760 896 L 920 896 L 1480 896 C 1593.5 896, 1593.5 445, 1707 445" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1200" y="908.75" text-anchor="middle">DoubleClick [element] / select</text></g><g class="edge kind-transition" id="t14" data-kind="transition" data-from="editing" data-to="idle" data-event="TextDone" data-actions="set the label, or the attribute its kind edits, by command"><path d="M 1716 450 C 1598 450, 1598 920, 1480 920 L 920 920 L 760 920 L 504 920 C 366.5 920, 366.5 764, 229 764" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="632" y="932.75" text-anchor="middle">TextDone / relabel</text></g><g class="edge kind-transition" id="t15" data-kind="transition" data-from="editing" data-to="idle" data-event="TextCancel, Escape, Blur, PaletteEdge, View, Edit, Hold, Context, DoubleClick on the background" data-actions="for PaletteEdge, choose the edge kind; for Context, select what is hit, unless it is selected"><path d="M 1716 455 C 1598 455, 1598 944, 1480 944 L 920 944 L 760 944 L 504 944 C 366.5 944, 366.5 768, 229 768" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="632" y="956.75" text-anchor="middle">TextCancel, Escape, Hold</text></g><g class="edge kind-transition" id="t16" data-kind="transition" data-from="editing" data-to="press" data-event="Press" data-actions="end the editing; the host commits the text first"><path d="M 1716 435 C 1598 435, 1598 440, 1480 440 L 920 440 C 785.64 440, 785.64 640.29, 651.29 640.29" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1200" y="435.25" text-anchor="middle">Press / end editing</text></g><g class="edge kind-transition" id="t17" data-kind="transition" data-from="connecting" data-to="panning" data-event="Press" data-guard="middle button or Alt"><path d="M 1060 680 C 1195.5 680, 1195.5 680, 1331 680" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1200" y="675.25" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t18" data-kind="transition" data-from="placing" data-to="panning" data-event="Press" data-guard="middle button or Alt"><path d="M 1060 744 L 1068 744 L 1280 744 C 1305.5 744, 1305.5 690, 1331 690" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1205.8" y="756.75" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t19" data-kind="transition" data-from="gesture" data-to="editing" data-event="DoubleClick" data-guard="on a vertex, a port, an outline or an edge, edit mode, not held" data-actions="put a drag back where it began; select it alone"><path d="M 1476 654 L 1484 654 L 1656 654 C 1681.5 654, 1681.5 430, 1707 430" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1518.4" y="649.25" text-anchor="middle">DoubleClick [element]</text></g><g class="edge kind-transition" id="t20" data-kind="transition" data-from="editing" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="remember the vertex kind"><path d="M 1716 425 C 1592 425, 1592 484, 1468 484 L 1068 484 L 1068 734 L 1064 734 L 1060 734" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1068" y="635.5" text-anchor="middle">PaletteVertex</text></g><g class="edge kind-transition" id="t21" data-kind="transition" data-from="gesture" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="put a drag back where it began; remember the vertex kind"><path d="M 924 634 L 908 634 C 907.5 634, 907.5 716, 907 716 L 1075 716 C 1074.5 716, 1074.5 754, 1074 754 L 1069 754" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="907.3" y="715.94" text-anchor="middle">PaletteVertex</text></g></g><g class="vertices"><g class="vertex kind-initial unplaced" id="start" data-kind="initial" transform="translate(0 752)"><g class="shape shape-filled-circle"><path class="mark" d="M -12 0 A 12 12 0 0 1 12 0 A 12 12 0 0 1 -12 0 Z"/></g><text class="label" x="0" y="26" text-anchor="middle"></text></g><g class="vertex kind-state unplaced" id="idle" data-kind="state" transform="translate(160 752)" data-internal="Tab / select the next vertex; Delete, an arrow, Ctrl-Z, Ctrl-Y / a command, refused in view mode or held; Context / select what is hit for the host's actions; View, Edit / set the mode; Hold, Unhold / hold the editor while the host waits"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Idle</text></g><g class="vertex kind-choice unplaced" id="press" data-kind="choice" transform="translate(632 656)"><polygon class="shape" points="0 -22 36 0 0 22 -36 0"/><text class="label" x="0" y="4" text-anchor="middle">under it?</text></g><g class="vertex kind-state unplaced" id="selecting" data-kind="state" transform="translate(1000 520)" data-internal="Move / draw the marquee; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Selecting</text></g><g class="vertex kind-state unplaced" id="dragging" data-kind="state" transform="translate(1000 584)" data-internal="Move / move the selection; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Dragging</text></g><g class="vertex kind-state unplaced" id="connecting" data-kind="state" transform="translate(1000 680)" data-internal="Move / draw the edge to the pointer; Press / only the pointer moves"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Connecting</text></g><g class="vertex kind-state unplaced" id="placing" data-kind="state" transform="translate(1000 744)" data-internal="Move / the new vertex follows the pointer; Press / only the pointer moves"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Placing</text></g><g class="vertex kind-state unplaced" id="panning" data-kind="state" transform="translate(1400 680)" data-internal="Move / pan the view; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Panning</text></g><g class="vertex kind-state unplaced" id="resizing" data-kind="state" transform="translate(1000 808)" data-internal="Move / draw the new size; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Resizing</text></g><g class="vertex kind-state unplaced" id="editing" data-kind="state" transform="translate(1776 440)" data-entry="the host shows an input for the label, or the attribute its kind edits" data-exit="the host hides it" data-internal="Move, Release, a key: ignored; the input has the keyboard"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">EditingText</text></g></g><g class="overlay"></g></svg>
