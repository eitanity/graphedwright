<svg xmlns="http://www.w3.org/2000/svg" viewBox="-36 396 1640 572" class="graphedwright" data-mode="view" role="img" aria-labelledby="graphedwright-title"><title id="graphedwright-title">The editor's gestures</title><desc></desc><defs><marker id="arrow-0" class="arrowhead kind-transition" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><g class="containers"><g class="vertex kind-composite_state container unplaced" id="gesture" data-kind="composite state" transform="translate(1068 654)" data-internal="a key other than Escape: ignored" data-exit="drop what the gesture held"><rect class="shape" x="-224" y="-190" width="448" height="380" rx="6"/><text class="label" x="-216" y="-176" text-anchor="start">Pointer gesture</text></g></g><g class="edges"><g class="edge kind-transition" id="t1" data-kind="transition" data-from="start" data-to="idle"><path d="M 12 752 C 51.5 752, 51.5 752, 91 752" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="56" y="747.25" text-anchor="middle">New</text></g><g class="edge kind-transition" id="t2" data-kind="transition" data-from="idle" data-to="press" data-event="Press" data-guard="not held, unless with the middle button or Alt"><path d="M 220 740 C 299 740, 299 684.33, 378 684.33 C 452.5 684.33, 452.5 648.67, 527 648.67" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="378" y="679.58" text-anchor="middle">Press</text></g><g class="edge kind-transition" id="t3" data-kind="transition" data-from="press" data-to="panning" data-guard="middle button or Alt"><path d="M 580.57 646.57 C 716.29 646.57, 716.29 492, 852 492 L 1046 492 L 1046 670 L 1112 670 L 1147 670" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="997.5" y="487.25" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t4" data-kind="transition" data-from="press" data-to="resizing" data-guard="on the resize handle of the one selected vertex, in edit mode"><path d="M 570.29 671.71 C 710.64 671.71, 710.64 808, 851 808" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="737.16" y="772.78" text-anchor="middle">[resize handle]</text></g><g class="edge kind-transition" id="t5" data-kind="transition" data-from="press" data-to="dragging" data-guard="on a vertex, in edit mode" data-actions="select it, adding to the selection with Shift; remember where the vertices to drag are"><path d="M 590.86 659.14 C 720.93 659.14, 720.93 584, 851 584" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="745.88" y="623.2" text-anchor="middle">[vertex] / select</text></g><g class="edge kind-transition" id="t6" data-kind="transition" data-from="press" data-to="connecting" data-guard="on a port or an outline, in edit mode" data-actions="remember the port or outline the edge starts at"><path d="M 580.57 665.43 C 715.79 665.43, 715.79 680, 851 680" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="699.05" y="683.31" text-anchor="middle">[port or outline]</text></g><g class="edge kind-transition" id="t7" data-kind="transition" data-from="press" data-to="selecting" data-guard="on the background" data-actions="select nothing, unless Shift is held"><path d="M 590.86 652.86 C 720.93 652.86, 720.93 520, 851 520" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="756.62" y="552.68" text-anchor="middle">[background]</text></g><g class="edge kind-transition" id="t8" data-kind="transition" data-from="press" data-to="idle" data-guard="on an edge, or on a vertex, a port or an outline in view mode" data-actions="select it, adding to the selection with Shift"><path d="M 536 663.33 C 457 663.33, 457 713.67, 378 713.67 C 303.5 713.67, 303.5 744, 229 744" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="378" y="726.42" text-anchor="middle">[edge, or view mode] / select</text></g><g class="edge kind-transition" id="t9" data-kind="transition" data-from="idle" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="remember the vertex kind"><path d="M 220 748 C 326 748, 326 704, 432 704 L 688 704 C 769.5 704, 769.5 744, 851 744" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="560" y="699.25" text-anchor="middle">PaletteVertex</text></g><g class="edge kind-transition" id="t10" data-kind="transition" data-from="gesture" data-to="idle" data-event="Release" data-actions="move the selection, select in the marquee or resize, if the pointer moved; add the edge or the vertex; by command"><path d="M 844 654 C 766 654, 766 728, 688 728 L 432 728 C 330.5 728, 330.5 752, 229 752" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="560" y="723.25" text-anchor="middle">Release / finish</text></g><g class="edge kind-transition" id="t11" data-kind="transition" data-from="gesture" data-to="idle" data-event="Escape, Blur, TextCancel, PaletteEdge, View, Edit, Hold, Context, DoubleClick on the background" data-actions="put a drag back where it began; for PaletteEdge, choose the edge kind; for Context, select what is hit, unless it is selected"><path d="M 844 674 C 766 674, 766 752, 688 752 L 432 752 C 330.5 752, 330.5 736, 229 736" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="560" y="747.25" text-anchor="middle">Escape, Blur, Hold / cancel</text></g><g class="edge kind-transition" id="t12" data-kind="transition" data-from="idle" data-to="editing" data-event="Enter, F2, a printable key" data-guard="one element selected, edit mode, not held"><path d="M 220 756 C 326 756, 326 872, 432 872 L 688 872 L 840 872 L 1304 872 C 1377.5 872, 1377.5 440, 1451 440" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1072" y="867.25" text-anchor="middle">Enter, F2, a key [one selected]</text></g><g class="edge kind-transition" id="t13" data-kind="transition" data-from="idle" data-to="editing" data-event="DoubleClick" data-guard="on a vertex, a port, an outline or an edge, edit mode, not held" data-actions="select it alone"><path d="M 220 760 C 326 760, 326 896, 432 896 L 688 896 L 840 896 L 1304 896 C 1377.5 896, 1377.5 445, 1451 445" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1072" y="908.75" text-anchor="middle">DoubleClick [element] / select</text></g><g class="edge kind-transition" id="t14" data-kind="transition" data-from="editing" data-to="idle" data-event="TextDone" data-actions="set the label, or the attribute its kind edits, by command"><path d="M 1460 450 C 1382 450, 1382 920, 1304 920 L 840 920 L 688 920 L 432 920 C 330.5 920, 330.5 764, 229 764" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="560" y="932.75" text-anchor="middle">TextDone / relabel</text></g><g class="edge kind-transition" id="t15" data-kind="transition" data-from="editing" data-to="idle" data-event="TextCancel, Escape, Blur, PaletteEdge, View, Edit, Hold, Context, DoubleClick on the background" data-actions="for PaletteEdge, choose the edge kind; for Context, select what is hit, unless it is selected"><path d="M 1460 455 C 1382 455, 1382 944, 1304 944 L 840 944 L 688 944 L 432 944 C 330.5 944, 330.5 768, 229 768" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="560" y="956.75" text-anchor="middle">TextCancel, Escape, Hold</text></g><g class="edge kind-transition" id="t16" data-kind="transition" data-from="editing" data-to="press" data-event="Press" data-actions="end the editing; the host commits the text first"><path d="M 1460 435 C 1382 435, 1382 440, 1304 440 L 840 440 C 709.64 440, 709.64 640.29, 579.29 640.29" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1072" y="435.25" text-anchor="middle">Press / end editing</text></g><g class="edge kind-transition" id="t17" data-kind="transition" data-from="connecting" data-to="panning" data-event="Press" data-guard="middle button or Alt"><path d="M 980 680 C 1063.5 680, 1063.5 680, 1147 680" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1068" y="675.25" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t18" data-kind="transition" data-from="placing" data-to="panning" data-event="Press" data-guard="middle button or Alt"><path d="M 980 744 C 1063.5 744, 1063.5 690, 1147 690" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1081.38" y="721.76" text-anchor="middle">[middle button or Alt]</text></g><g class="edge kind-transition" id="t19" data-kind="transition" data-from="gesture" data-to="editing" data-event="DoubleClick" data-guard="on a vertex, a port, an outline or an edge, edit mode, not held" data-actions="put a drag back where it began; select it alone"><path d="M 1292 654 C 1371.5 654, 1371.5 430, 1451 430" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1376" y="537.25" text-anchor="middle">DoubleClick [element]</text></g><g class="edge kind-transition" id="t20" data-kind="transition" data-from="editing" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="remember the vertex kind"><path d="M 1460 425 C 1372 425, 1372 492, 1284 492 L 1090 492 L 1090 734 L 1024 734 L 989 734" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="1138.5" y="487.25" text-anchor="middle">PaletteVertex</text></g><g class="edge kind-transition" id="t21" data-kind="transition" data-from="gesture" data-to="placing" data-event="PaletteVertex" data-guard="edit mode, not held" data-actions="put a drag back where it began; remember the vertex kind"><path d="M 844 634 L 828 634 C 827.5 634, 827.5 716, 827 716 L 995 716 C 994.5 716, 994.5 754, 994 754 L 989 754" stroke-width="1.5" marker-end="url(#arrow-0)"/><text class="label" x="828" y="646.75" text-anchor="middle">PaletteVertex</text></g></g><g class="vertices"><g class="vertex kind-initial unplaced" id="start" data-kind="initial" transform="translate(0 752)"><g class="shape shape-filled-circle"><path class="mark" d="M -12 0 A 12 12 0 0 1 12 0 A 12 12 0 0 1 -12 0 Z"/></g><text class="label" x="0" y="26" text-anchor="middle"></text></g><g class="vertex kind-state unplaced" id="idle" data-kind="state" transform="translate(160 752)" data-internal="Tab / select the next vertex; Delete, an arrow, Ctrl-Z, Ctrl-Y / a command, refused in view mode or held; Context / select what is hit for the host's actions; View, Edit / set the mode; Hold, Unhold / hold the editor while the host waits"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Idle</text></g><g class="vertex kind-choice unplaced" id="press" data-kind="choice" transform="translate(560 656)"><polygon class="shape" points="0 -22 36 0 0 22 -36 0"/><text class="label" x="0" y="4" text-anchor="middle">under it?</text></g><g class="vertex kind-state unplaced" id="selecting" data-kind="state" transform="translate(920 520)" data-internal="Move / draw the marquee; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Selecting</text></g><g class="vertex kind-state unplaced" id="dragging" data-kind="state" transform="translate(920 584)" data-internal="Move / move the selection; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Dragging</text></g><g class="vertex kind-state unplaced" id="connecting" data-kind="state" transform="translate(920 680)" data-internal="Move / draw the edge to the pointer; Press / only the pointer moves"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Connecting</text></g><g class="vertex kind-state unplaced" id="placing" data-kind="state" transform="translate(920 744)" data-internal="Move / the new vertex follows the pointer; Press / only the pointer moves"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Placing</text></g><g class="vertex kind-state unplaced" id="panning" data-kind="state" transform="translate(1216 680)" data-internal="Move / pan the view; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Panning</text></g><g class="vertex kind-state unplaced" id="resizing" data-kind="state" transform="translate(920 808)" data-internal="Move / draw the new size; Press: ignored, a second pointer"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">Resizing</text></g><g class="vertex kind-state unplaced" id="editing" data-kind="state" transform="translate(1520 440)" data-entry="the host shows an input for the label, or the attribute its kind edits" data-exit="the host hides it" data-internal="Move, Release, a key: ignored; the input has the keyboard"><rect class="shape" x="-60" y="-20" width="120" height="40" rx="6"/><text class="label" x="0" y="4" text-anchor="middle">EditingText</text></g></g><g class="overlay"></g></svg>
